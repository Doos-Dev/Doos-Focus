spring.application.name=Doos-Focus
spring.datasource.url=jdbc:h2:file:./data/doosfocus
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# Nunca exponer la consola de H2
spring.h2.console.enabled=false

# Errores sin información interna
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Sin SQL en logs
spring.jpa.show-sql=false

# Evita consultas perezosas durante el render de la vista
spring.jpa.open-in-view=false

# Cookie de sesión
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Activar cuando uses HTTPS:
# server.servlet.session.cookie.secure=true
